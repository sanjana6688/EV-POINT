<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>EV Charging - Booking | EV POINT</title>
  <link rel="stylesheet" href="/static/user/user-login-dashboard.css">
  <link rel="stylesheet" href="/static/user/book.css?v=1.1">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">
  <link rel="icon" href="/static/temp/assets/images/icon.ico">
  <!-- Import Inter Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <script>
    window.addEventListener('pageshow', function (event) {
      if (event.persisted) {
        fetch('/check-session').then(response => {
          if (!response.ok) {
            window.location.href = '/login';
          }
        }).catch(() => {
          window.location.href = '/login';
        });
      }
    });
  </script>
</head>

<body>
  <!-- Wrapper -->
  <div class="d-flex" id="wrapper">

    <!-- Sidebar -->
    <div class="sidebar-wrapper animate-fade-in" id="sidebar-wrapper">
      <div class="sidebar-brand">
        <svg class="logo-svg" width="150" height="30" viewBox="0 0 170 35" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M2 12H6" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
          <path d="M2 17H6" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
          <path d="M2 22H6" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
          <path d="M6 10C6 8.89543 6.89543 8 8 8H12C13.1046 8 14 8.89543 14 10V24C14 25.1046 13.1046 26 12 26H8C6.89543 26 6 25.1046 6 24V10Z" fill="white"/>
          <path d="M14 17H19C21 17 22 12 24 12" stroke="white" stroke-width="2.5" stroke-linecap="round" fill="none"/>
          <text x="28" y="24" font-family="'Inter', sans-serif" font-weight="900" font-size="20" fill="white" letter-spacing="0.5">EV POINT</text>
        </svg>
      </div>

      <div class="list-group list-group-flush">
        <a href="/user-dashboard" class="list-group-item list-group-item-action">
          <i class="fa fa-tachometer mr-3"></i>Dashboard
        </a>
        <a href="/user-profile" class="list-group-item list-group-item-action">
          <i class="fa fa-user mr-3"></i>Profile
        </a>
        <a href="{{ url_for('user_find_your_charger') }}" class="list-group-item list-group-item-action active">
          <i class="fa fa-calendar-plus-o mr-3"></i>Book a New Slot
        </a>
        <a href="{{ url_for('contact_us') }}" class="list-group-item list-group-item-action">
          <i class="fa fa-envelope mr-3"></i>Contact Us
        </a>
        <a href="/logout" class="list-group-item list-group-item-action logout-link">
          <i class="fa fa-sign-out mr-3"></i>Logout
        </a>
      </div>
    </div>

    <!-- Page Content -->
    <div id="page-content-wrapper" class="w-100">
      <nav class="navbar navbar-light bg-white border-bottom py-3 px-4">
        <div class="container-fluid d-flex justify-content-between align-items-center">
          <button class="btn btn-outline-dark btn-sm d-md-none" id="menu-toggle-btn">
            <i class="fa fa-bars"></i>
          </button>
          <h4 class="mb-0 text-dark font-weight-bold">SLOT RESERVATION</h4>
          <a href="/user-profile" class="nav-profile-icon text-muted">
            <i class="fa fa-user-circle fa-lg"></i>
          </a>
        </div>
      </nav>

      <div class="container-fluid px-4 py-5 animate-slide-up">
        
        <div class="booking-card border-0 shadow-sm p-5">
          <div class="booking-header text-center mb-5">
            <i class="fa-regular fa-calendar-check fa-4x text-dark"></i>
            <h2 class="font-weight-black mt-3">Book Your Charging Slot</h2>
            <p class="text-muted">Confirm details and specify the desired scheduling slot below.</p>
          </div>

          <div id="booking-alert-general" class="form-error-general" style="display: none;"></div>
          
          <form action="/book" method="POST" class="booking-form">
            <div class="row">
              <div class="col-md-6 mb-4">
                <div class="form-group">
                  <label for="Station_name">Station Name</label>
                  <input type="text" class="form-control form-input" id="Station_name" name="Station_name"
                    value="{{ request.args.get('Station_name') }}" readonly>
                </div>
              </div>

              <div class="col-md-6 mb-4">
                <div class="form-group">
                  <label for="City">City</label>
                  <input type="text" class="form-control form-input" id="City" name="City"
                    value="{{ request.args.get('City') }}" readonly>
                </div>
              </div>
            </div>

            <div class="form-group mb-4">
              <label for="Available_ports">Selected Connector Port</label>
              <input type="text" class="form-control form-input" id="Available_ports" name="Available_ports"
                value="{{ request.args.get('Available_ports') }}" readonly>
            </div>

            <div class="row">
              <div class="col-md-4 mb-4">
                <div class="form-group">
                  <label for="Booking_date">Booking Date</label>
                  <input type="date" class="form-control form-input" id="Booking_date" name="Booking_date" required>
                </div>
              </div>

              <div class="col-md-4 mb-4">
                <div class="form-group">
                  <label for="Time_from">Start Time</label>
                  <input type="time" class="form-control form-input" id="Time_from" name="Time_from" required>
                </div>
              </div>

              <div class="col-md-4 mb-4">
                <div class="form-group">
                  <label for="Time_to">End Time</label>
                  <input type="time" class="form-control form-input" id="Time_to" name="Time_to" required>
                </div>
              </div>
            </div>

            <button type="submit" class="btn-submit mt-4">
              CONFIRM RESERVATION
            </button>
          </form>
        </div>

      </div>
    </div>
  </div>

  <!-- JavaScript -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script>


    $(document).ready(function () {
      $("#menu-toggle-btn").click(function (e) {
        e.preventDefault();
        $("#wrapper").toggleClass("toggled");
      });

      // Set min date to today
      document.getElementById('Booking_date').min = new Date().toISOString().split('T')[0];

      // Form validation
      document.querySelector('.booking-form').addEventListener('submit', function (e) {
        const date = document.getElementById("Booking_date").value;
        const from = document.getElementById("Time_from").value;
        const to = document.getElementById("Time_to").value;

        if (!date || !from || !to) {
          e.preventDefault();
          showLocalAlert("Please fill all required fields.");
          return false;
        }

        if (from >= to) {
          e.preventDefault();
          showLocalAlert("End time must be after start time.");
          return false;
        }

        if (!confirm("Are you sure you want to book this slot?")) {
          e.preventDefault();
          return false;
        }
      });

      function showLocalAlert(msg) {
        const box = document.getElementById('booking-alert-general');
        if (box) {
          box.textContent = msg;
          box.style.display = 'block';
          box.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
      }

      document.getElementById('Booking_date').addEventListener('change', () => {
        document.getElementById('booking-alert-general').style.display = 'none';
      });
      document.getElementById('Time_from').addEventListener('change', () => {
        document.getElementById('booking-alert-general').style.display = 'none';
      });
      document.getElementById('Time_to').addEventListener('change', () => {
        document.getElementById('booking-alert-general').style.display = 'none';
      });
    });
  </script>
</body>
</html>
